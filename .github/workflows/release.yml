name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Download and verify Mihomo
        shell: pwsh
        run: |
          $path = ./tools/fetch_mihomo.ps1
          "GPTGUARD_MIHOMO_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and test
        run: cargo test --all-targets --target x86_64-pc-windows-msvc
      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Stage application binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\gptguard.exe target\release\GPTGuard.exe -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build single-file installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\GPTGuard.iss
          $assets = @(Get-ChildItem dist -File -Filter *.exe)
          if ($assets.Count -ne 1) { throw "expected exactly one EXE release asset, got $($assets.Count)" }
          if (Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip','.7z' }) { throw "archive release assets are forbidden" }
      - name: Smoke install and uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist -File -Filter 'GPTGuard-Setup-v0.4.0-windows-x64.exe').FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'GPTGuardSmoke'
          $installLog = Join-Path $env:RUNNER_TEMP 'GPTGuardSmoke-install.log'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/DIR=$installDir", "/LOG=$installLog"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 80 }
            throw "installer exited with code $($install.ExitCode)"
          }
          $app = Join-Path $installDir 'GPTGuard.exe'
          if (!(Test-Path $app)) { throw "installed GPTGuard.exe is missing" }
          $doctor = Start-Process -FilePath $app -ArgumentList @('--cli', 'doctor') -Wait -PassThru -WindowStyle Hidden
          if ($doctor.ExitCode -ne 0) { throw "installed diagnostic exited with code $($doctor.ExitCode)" }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with code $($uninstall.ExitCode)" }
          }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GPTGuard-Setup-v0.4.0-windows-x64.exe
          fail_on_unmatched_files: true
