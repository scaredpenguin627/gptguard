[package]
name = "gptguard"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
build = "build.rs"
authors = ["scaredpenguin627"]
description = "GPTGuard / GPTGuard: egress guard and Codex turn-state relay for ChatGPT and Codex"
license = "GPL-3.0-only"
repository = "https://github.com/scaredpenguin627/gptguard"
readme = "README.md"
keywords = ["chatgpt", "codex", "proxy", "egress", "windows"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
http = "1"
ipnet = "2"
open = "5"
rand = "0.8"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls", "socks", "stream", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
slint = { version = "1", default-features = false, features = ["compat-1-18", "backend-winit", "renderer-femtovg"] }
sysinfo = "0.40"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
winit = "0.30"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
